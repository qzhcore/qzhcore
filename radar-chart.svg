<svg width="460" height="300" viewBox="0 0 460 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="460" height="300" fill="#0d1117" rx="8"/>

  <!-- Horizontal axis: Commits (left) → Issues (right) -->
  <line x1="90" y1="150" x2="370" y2="150" stroke="#3fb950" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Vertical axis: Code review (top) → Pull requests (bottom) -->
  <line x1="230" y1="35" x2="230" y2="265" stroke="#3fb950" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Commits dot: 92% -->
  <circle cx="101" cy="150" r="7" fill="#3fb950"/>
  <!-- Glow ring -->
  <circle cx="101" cy="150" r="11" fill="none" stroke="#3fb950" stroke-width="0.8" opacity="0.35"/>

  <!-- Pull requests dot: 8% -->
  <circle cx="230" cy="159" r="4" fill="#3fb950" opacity="0.65"/>

  <!-- Center -->
  <circle cx="230" cy="150" r="2.5" fill="#3fb950" opacity="0.25"/>

  <text x="230" y="22" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#8b949e">Code review</text>
  <text x="380" y="155" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#8b949e">Issues</text>
  <text x="165" y="290" text-anchor="end" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#8b949e">8%</text>
  <text x="170" y="290" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#8b949e">Pull requests</text>
  <text x="12" y="143" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#8b949e">92%</text>
  <text x="12" y="160" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#8b949e">Commits</text>
</svg>
